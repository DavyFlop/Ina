<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos dessins</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #2d1b4e, #ff4fa0);
            color: white;
            text-align: center;
        }

        nav {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header {
            padding: 50px 20px;
        }

        header h1 {
            font-size: 50px;
        }

        canvas {
            background: black;
            display: block;
            margin: 20px auto;
            border-radius: 20px;
        }

        .buttons {
            margin: 20px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 5px;
        }

        .start {
            background: hotpink;
            color: white;
        }

        .reset {
            background: #ffd700;
            color: black;
        }

        .gallery {
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card img {
            width: 100%;
            max-height: 280px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
        }

        .card .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
            text-align: center;
        }

        .card .desc {
            font-size: 14px;
            color: #f2d6ff;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="fleurs.html">Fleurs</a></li>
            <li><a href="animaux.html">Animaux</a></li>
            <li><a href="sejour.html">Séjour</a></li>
            <li><a href="dessins.html">Dessins</a></li>
            <li><a href="sejour-france.html">Séjour France</a></li>
        </ul>
    </nav>

    <header>
        <h1>Nos dessins #artistes</h1>
    </header>

    <div class="buttons">
        <button class="start" onclick="startDrawing()">▶ Lancer</button>
        <button class="reset" onclick="resetDrawing()">🔄 Reset</button>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <section class="gallery">
        <div class="card">

            <div class="title">8 février 2026</div>
            <div class="desc">Je t'aime</div>

            <img src="images/dessin1.jfif" alt="dessin1">

        </div>
        <div class="card">

            <div class="title">12 février 2026</div>
            <div class="desc">Davy #jaune</div>

            <img src="images/dessin2.jfif" alt="dessin2">

        </div>
        <div class="card">

            <div class="title">14 février 2026</div>
            <div class="desc">Saint Valentin</div>

            <img src="images/dessin3.jfif" alt="dessin3">

        </div>
        <div class="card">

            <div class="title">23 février 2026</div>
            <div class="desc">Les maths</div>

            <img src="images/dessin4.jfif" alt="dessin4">

        </div>
        <div class="card">

            <div class="title">23 février 2026</div>
            <div class="desc">Ce mignonnn</div>

            <img src="images/dessin5.jfif" alt="dessin5">

        </div>
        <div class="card">

            <div class="title">12 avril 2026</div>
            <div class="desc">Un chat ?</div>

            <img src="images/dessin6.jfif" alt="dessin6">

        </div>
    </section>

    <script src="turtle.js"></script>

</body>

</html>
